<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In Form</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="shortcut icon"
      href="undraw_nature_m5ll.svg"
      type="image/x-icon"
    />
    <link
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="wrapper">
      <div class="left-content">
        <img src="undraw_nature_m5ll.svg" alt="" />
      </div>
      <div class="login-content">
        <h1 class="title">Sign in</h1>
        <h4 class="external-signin">Sign in with Open account</h4>
        <div class="buttons">
          <button>
            <a href=""><i class="bx bxl-google"></i> Google</a>
          </button>
          <button>
            <a href=""><i class="bx bxl-apple"></i> Apple ID</a>
          </button>
        </div>
        <span class="line"></span>
        <h4 class="email-signin">Or continue with email address</h4>
        <form action="">
          <div class="field">
            <input type="text" name="" id="" placeholder="email" />
            <i class="bx bxs-envelope"></i>
          </div>
          <div class="field">
            <input type="password" name="" id="" placeholder="password" />
            <i class="bx bxs-lock-alt"></i>
          </div>
          <input type="submit" value="Sign in" />
        </form>
      </div>
      <div class="signup-link">
        <span>Dont have an account?</span>
        <span><a href="#">Sign up</a></span>
      </div>
    </div>
  </body>
</html>
